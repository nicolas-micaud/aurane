<!doctype html>
<html><head><meta charset="utf-8"><title>Aurane sprite renderer</title>
<script type="importmap">{ "imports": { "three": "/three/three.module.js", "three/addons/": "/three-addons/" } }</script>
<style>body{margin:0;background:#111}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from 'three';
import { MODELS, TEAM_BASE } from './models.js';

// Three-quarter view, as StarCraft: structures are seen from higher up (their footprint reads),
// ships from lower (their profile reads).
const ELEVATION = { ship: 38, structure: 55 };
const SHIPS = new Set(['corvette', 'frigate', 'cruiser', 'cargo']);
const FRAMES = 16;
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const gltfLoader = new GLTFLoader();
/** A sculpted glTF in tools/sprites/models/<kind>.glb replaces the procedural model; materials named
 *  with "team" or "lights" carry the faction colour. Returns null when there is none. */
async function loadGltf(kind) {
  try {
    const res = await fetch(`/models/${kind}.glb`, { method: 'HEAD' });
    if (!res.ok) return null;
    const gltf = await gltfLoader.loadAsync(`/models/${kind}.glb`);
    gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; const n = (o.material?.name ?? '').toLowerCase(); o.userData.team = /team|lights/.test(n); } });
    return gltf.scene;
  } catch { return null; }
}

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Image-based lighting gives the metal something to reflect; the key light casts real shadows.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.3;
const key = new THREE.DirectionalLight(0xfff0d8, 3.6); key.position.set(-6, 10, 7);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
const fill = new THREE.DirectionalLight(0x8fb8ff, 0.7); fill.position.set(6, 3, -3);
const rim = new THREE.DirectionalLight(0xffffff, 1.2); rim.position.set(1, 3, -8);
const amb = new THREE.AmbientLight(0x3d4a66, 0.3);
scene.add(key, fill, rim, amb);

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
const dist = 30;
function aim(elevationDeg) {
  const e = elevationDeg * Math.PI / 180;
  camera.position.set(0, Math.sin(e) * dist, Math.cos(e) * dist);
  camera.lookAt(0, 0, 0);
}

const black = new THREE.MeshBasicMaterial({ color: 0x000000 });
const white = new THREE.MeshBasicMaterial({ color: 0xffffff });

function fit(group) {
  const box = new THREE.Box3().setFromObject(group);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  group.position.sub(center);
  // Radius of the bounding sphere in the ground plane plus height: everything stays inside the frame at every angle.
  const radius = Math.max(Math.hypot(size.x, size.z) / 2, size.y / 2) * 1.12;
  return radius;
}

/** Renders one model to two sheets (base, lights) of FRAMES frames of `px` pixels. Returns data URLs. */
window.renderModel = async function renderModel(kind, px) {
  const group = (await loadGltf(kind)) ?? MODELS[kind]();
  const elevation = SHIPS.has(kind) ? ELEVATION.ship : ELEVATION.structure;
  aim(elevation);
  const radius = fit(group);
  scene.add(group);
  camera.left = -radius; camera.right = radius; camera.top = radius; camera.bottom = -radius;
  camera.updateProjectionMatrix();
  const sc = key.shadow.camera; sc.left = -radius * 1.6; sc.right = radius * 1.6; sc.top = radius * 1.6; sc.bottom = -radius * 1.6; sc.near = 0.5; sc.far = 60; sc.updateProjectionMatrix();
  const ss = 3; // supersampling
  renderer.setSize(px * ss, px * ss, false);
  const sheets = {};
  for (const pass of ['base', 'lights']) {
    const canvas = document.createElement('canvas');
    canvas.width = px * FRAMES; canvas.height = px;
    const ctx = canvas.getContext('2d');
    for (let i = 0; i < FRAMES; i++) {
      group.rotation.y = (i / FRAMES) * Math.PI * 2;
      group.traverse((o) => {
        if (!o.isMesh) return;
        if (!o.userData.base) o.userData.base = o.material;
        if (pass === 'base') o.material = o.userData.team ? TEAM_BASE : o.userData.base;
        else o.material = o.userData.team ? white : black;
      });
      const lightsOn = pass === 'base';
      key.visible = fill.visible = rim.visible = amb.visible = lightsOn;
      renderer.render(scene, camera);
      ctx.drawImage(renderer.domElement, 0, 0, px * ss, px * ss, i * px, 0, px, px);
    }
    if (pass === 'lights') {
      // Alpha from luminance so the sheet tints cleanly.
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = img.data;
      for (let k = 0; k < d.length; k += 4) { const l = d[k]; d[k] = d[k + 1] = d[k + 2] = 255; d[k + 3] = Math.min(d[k + 3], l); }
      ctx.putImageData(img, 0, 0);
    }
    sheets[pass] = canvas.toDataURL('image/png');
  }
  scene.remove(group);
  key.visible = fill.visible = rim.visible = amb.visible = true;
  return { ...sheets, frames: FRAMES, px, radius, elevation };
};
/** One large frame with the faction colour baked in, for icons and the showcase site. */
window.renderIcon = async function renderIcon(kind, px, teamHex, frame = 2) {
  const r = await window.renderModel(kind, px);
  return new Promise((resolve) => {
    const base = new Image(), lights = new Image();
    let n = 0;
    const done = () => {
      if (++n < 2) return;
      const c = document.createElement('canvas'); c.width = px; c.height = px;
      const ctx = c.getContext('2d');
      ctx.drawImage(base, frame * px, 0, px, px, 0, 0, px, px);
      const tint = document.createElement('canvas'); tint.width = px; tint.height = px;
      const tctx = tint.getContext('2d');
      tctx.drawImage(lights, frame * px, 0, px, px, 0, 0, px, px);
      tctx.globalCompositeOperation = 'source-in'; tctx.fillStyle = teamHex; tctx.fillRect(0, 0, px, px);
      ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(tint, 0, 0); ctx.globalAlpha = 0.5; ctx.drawImage(tint, 0, 0);
      resolve(c.toDataURL('image/png'));
    };
    base.onload = done; lights.onload = done; base.src = r.base; lights.src = r.lights;
  });
};
window.MODEL_KINDS = Object.keys(MODELS);
window.__ready = true;
</script>
</body></html>

# Production stack for one season on a single Exoscale VM (ninabot pattern: compose +
# tunnel). Ports bind to loopback only; cloudflared publishes the world over the tunnel and
# the tailnet carries everything else. Secrets come from .env, loaded from Vaultwarden at
# deploy time, never committed.
services:
  world:
    image: ${WORLD_IMAGE:-aurane-world:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://aurane:${POSTGRES_PASSWORD}@postgres:5432/aurane
      SEASON_SEED: ${SEASON_SEED:-season-0}
      GALAXY_RADIUS: ${GALAXY_RADIUS:-12}
      # Closed beta: invitations, admin endpoint and device links (decision: bêta fermée, 24.09.2026).
      REQUIRE_INVITE: ${REQUIRE_INVITE:-1}
      INVITE_CODES: ${INVITE_CODES:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      AUTH_SECRET: ${AUTH_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://play.playaurane.com}
      # Passkeys (decision 0010): RP ID = registrable domain of PUBLIC_ORIGIN unless set; extra origins for staging.
      RP_ID: ${RP_ID:-}
      RP_ORIGINS: ${RP_ORIGINS:-}
      SEASON_DAYS: ${SEASON_DAYS:-56}
      NPC_COUNT: ${NPC_COUNT:-30}
      TIME_SCALE: "1"
      HOST: 0.0.0.0
      PORT: "8080"
      # LLM (packages/general/src/llm/, docs/ai/ARCHITECTURE.md, bloc cible dans docs/ops/beta.md). Une classe = un modèle
      # épinglé servi par une liste ordonnée de fournisseurs ; jamais de bascule vers un autre modèle. Classes : voice
      # (talk, doctrine), routine (conseil, briefing, épisode ; sans elle, ces tâches passent par voice), narrative
      # (Gazette). Emplacements : scaleway, infomaniak, vllm (voix), scaleway-small (routine), apertus (narratif).
      # Valeurs dans .env (Vaultwarden collection aurane, items env=LLM_*). Absentes = pas de Général LLM, le monde
      # tourne quand même. Aucun prix par défaut : un fournisseur sans _PRICE_IN/_PRICE_OUT n'est pas compté dans
      # LLM_BUDGET_EUR_MONTH (avertissement au démarrage). Les anciennes LLM_PRIMARY_*/LLM_FALLBACK_* restent lues.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Payments (decision 0011, docs/ops/beta.md): Stripe Managed Payments, merchant of record. All three set or
      # payments are disabled (routes 503, no buy button). Values from Vaultwarden, never in the repo.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_SUPPORT_FOUNDER: ${STRIPE_PRICE_SUPPORT_FOUNDER:-}
      LLM_VOICE_MODEL: ${LLM_VOICE_MODEL:-}
      LLM_VOICE_PROVIDERS: ${LLM_VOICE_PROVIDERS:-}
      LLM_ROUTINE_MODEL: ${LLM_ROUTINE_MODEL:-}
      LLM_ROUTINE_PROVIDERS: ${LLM_ROUTINE_PROVIDERS:-}
      LLM_NARRATIVE_MODEL: ${LLM_NARRATIVE_MODEL:-}
      LLM_NARRATIVE_PROVIDERS: ${LLM_NARRATIVE_PROVIDERS:-}
      LLM_PROVIDER_SCALEWAY_BASE_URL: ${LLM_PROVIDER_SCALEWAY_BASE_URL:-}
      LLM_PROVIDER_SCALEWAY_API_KEY: ${LLM_PROVIDER_SCALEWAY_API_KEY:-}
      LLM_PROVIDER_SCALEWAY_MODEL: ${LLM_PROVIDER_SCALEWAY_MODEL:-}
      LLM_PROVIDER_SCALEWAY_MODEL_ID: ${LLM_PROVIDER_SCALEWAY_MODEL_ID:-}
      LLM_PROVIDER_SCALEWAY_CONCURRENCY: ${LLM_PROVIDER_SCALEWAY_CONCURRENCY:-8}
      LLM_PROVIDER_SCALEWAY_TIMEOUT_MS: ${LLM_PROVIDER_SCALEWAY_TIMEOUT_MS:-9000}
      LLM_PROVIDER_SCALEWAY_JSON_MODE: ${LLM_PROVIDER_SCALEWAY_JSON_MODE:-object}
      LLM_PROVIDER_SCALEWAY_EXTRA_BODY: ${LLM_PROVIDER_SCALEWAY_EXTRA_BODY:-}
      LLM_PROVIDER_SCALEWAY_DISABLE_REASONING: ${LLM_PROVIDER_SCALEWAY_DISABLE_REASONING:-}
      LLM_PROVIDER_SCALEWAY_MAX_QUEUED: ${LLM_PROVIDER_SCALEWAY_MAX_QUEUED:-}
      LLM_PROVIDER_SCALEWAY_RETRIES: ${LLM_PROVIDER_SCALEWAY_RETRIES:-}
      LLM_PROVIDER_SCALEWAY_PRICE_IN: ${LLM_PROVIDER_SCALEWAY_PRICE_IN:-}
      LLM_PROVIDER_SCALEWAY_PRICE_OUT: ${LLM_PROVIDER_SCALEWAY_PRICE_OUT:-}
      LLM_PROVIDER_SCALEWAY_BREAKER_FAILURES: ${LLM_PROVIDER_SCALEWAY_BREAKER_FAILURES:-}
      LLM_PROVIDER_SCALEWAY_BREAKER_OPEN_MS: ${LLM_PROVIDER_SCALEWAY_BREAKER_OPEN_MS:-}
      LLM_PROVIDER_SCALEWAY_SMALL_BASE_URL: ${LLM_PROVIDER_SCALEWAY_SMALL_BASE_URL:-}
      LLM_PROVIDER_SCALEWAY_SMALL_API_KEY: ${LLM_PROVIDER_SCALEWAY_SMALL_API_KEY:-}
      LLM_PROVIDER_SCALEWAY_SMALL_MODEL: ${LLM_PROVIDER_SCALEWAY_SMALL_MODEL:-}
      LLM_PROVIDER_SCALEWAY_SMALL_MODEL_ID: ${LLM_PROVIDER_SCALEWAY_SMALL_MODEL_ID:-}
      LLM_PROVIDER_SCALEWAY_SMALL_CONCURRENCY: ${LLM_PROVIDER_SCALEWAY_SMALL_CONCURRENCY:-8}
      LLM_PROVIDER_SCALEWAY_SMALL_TIMEOUT_MS: ${LLM_PROVIDER_SCALEWAY_SMALL_TIMEOUT_MS:-9000}
      LLM_PROVIDER_SCALEWAY_SMALL_JSON_MODE: ${LLM_PROVIDER_SCALEWAY_SMALL_JSON_MODE:-schema}
      LLM_PROVIDER_SCALEWAY_SMALL_EXTRA_BODY: ${LLM_PROVIDER_SCALEWAY_SMALL_EXTRA_BODY:-}
      LLM_PROVIDER_SCALEWAY_SMALL_DISABLE_REASONING: ${LLM_PROVIDER_SCALEWAY_SMALL_DISABLE_REASONING:-}
      LLM_PROVIDER_SCALEWAY_SMALL_MAX_QUEUED: ${LLM_PROVIDER_SCALEWAY_SMALL_MAX_QUEUED:-}
      LLM_PROVIDER_SCALEWAY_SMALL_RETRIES: ${LLM_PROVIDER_SCALEWAY_SMALL_RETRIES:-}
      LLM_PROVIDER_SCALEWAY_SMALL_PRICE_IN: ${LLM_PROVIDER_SCALEWAY_SMALL_PRICE_IN:-}
      LLM_PROVIDER_SCALEWAY_SMALL_PRICE_OUT: ${LLM_PROVIDER_SCALEWAY_SMALL_PRICE_OUT:-}
      LLM_PROVIDER_SCALEWAY_SMALL_BREAKER_FAILURES: ${LLM_PROVIDER_SCALEWAY_SMALL_BREAKER_FAILURES:-}
      LLM_PROVIDER_SCALEWAY_SMALL_BREAKER_OPEN_MS: ${LLM_PROVIDER_SCALEWAY_SMALL_BREAKER_OPEN_MS:-}
      LLM_PROVIDER_INFOMANIAK_BASE_URL: ${LLM_PROVIDER_INFOMANIAK_BASE_URL:-}
      LLM_PROVIDER_INFOMANIAK_API_KEY: ${LLM_PROVIDER_INFOMANIAK_API_KEY:-}
      LLM_PROVIDER_INFOMANIAK_MODEL: ${LLM_PROVIDER_INFOMANIAK_MODEL:-}
      LLM_PROVIDER_INFOMANIAK_MODEL_ID: ${LLM_PROVIDER_INFOMANIAK_MODEL_ID:-}
      LLM_PROVIDER_INFOMANIAK_CONCURRENCY: ${LLM_PROVIDER_INFOMANIAK_CONCURRENCY:-4}
      LLM_PROVIDER_INFOMANIAK_TIMEOUT_MS: ${LLM_PROVIDER_INFOMANIAK_TIMEOUT_MS:-9000}
      LLM_PROVIDER_INFOMANIAK_JSON_MODE: ${LLM_PROVIDER_INFOMANIAK_JSON_MODE:-}
      LLM_PROVIDER_INFOMANIAK_EXTRA_BODY: ${LLM_PROVIDER_INFOMANIAK_EXTRA_BODY:-}
      LLM_PROVIDER_INFOMANIAK_DISABLE_REASONING: ${LLM_PROVIDER_INFOMANIAK_DISABLE_REASONING:-1}
      LLM_PROVIDER_INFOMANIAK_MAX_QUEUED: ${LLM_PROVIDER_INFOMANIAK_MAX_QUEUED:-}
      LLM_PROVIDER_INFOMANIAK_RETRIES: ${LLM_PROVIDER_INFOMANIAK_RETRIES:-}
      LLM_PROVIDER_INFOMANIAK_PRICE_IN: ${LLM_PROVIDER_INFOMANIAK_PRICE_IN:-}
      LLM_PROVIDER_INFOMANIAK_PRICE_OUT: ${LLM_PROVIDER_INFOMANIAK_PRICE_OUT:-}
      LLM_PROVIDER_INFOMANIAK_BREAKER_FAILURES: ${LLM_PROVIDER_INFOMANIAK_BREAKER_FAILURES:-}
      LLM_PROVIDER_INFOMANIAK_BREAKER_OPEN_MS: ${LLM_PROVIDER_INFOMANIAK_BREAKER_OPEN_MS:-}
      LLM_PROVIDER_VLLM_BASE_URL: ${LLM_PROVIDER_VLLM_BASE_URL:-}
      LLM_PROVIDER_VLLM_API_KEY: ${LLM_PROVIDER_VLLM_API_KEY:-}
      LLM_PROVIDER_VLLM_MODEL: ${LLM_PROVIDER_VLLM_MODEL:-}
      LLM_PROVIDER_VLLM_MODEL_ID: ${LLM_PROVIDER_VLLM_MODEL_ID:-}
      LLM_PROVIDER_VLLM_CONCURRENCY: ${LLM_PROVIDER_VLLM_CONCURRENCY:-4}
      LLM_PROVIDER_VLLM_TIMEOUT_MS: ${LLM_PROVIDER_VLLM_TIMEOUT_MS:-30000}
      LLM_PROVIDER_VLLM_JSON_MODE: ${LLM_PROVIDER_VLLM_JSON_MODE:-schema}
      LLM_PROVIDER_VLLM_EXTRA_BODY: ${LLM_PROVIDER_VLLM_EXTRA_BODY:-}
      LLM_PROVIDER_VLLM_DISABLE_REASONING: ${LLM_PROVIDER_VLLM_DISABLE_REASONING:-}
      LLM_PROVIDER_VLLM_MAX_QUEUED: ${LLM_PROVIDER_VLLM_MAX_QUEUED:-}
      LLM_PROVIDER_VLLM_RETRIES: ${LLM_PROVIDER_VLLM_RETRIES:-}
      LLM_PROVIDER_VLLM_PRICE_IN: ${LLM_PROVIDER_VLLM_PRICE_IN:-}
      LLM_PROVIDER_VLLM_PRICE_OUT: ${LLM_PROVIDER_VLLM_PRICE_OUT:-}
      LLM_PROVIDER_VLLM_BREAKER_FAILURES: ${LLM_PROVIDER_VLLM_BREAKER_FAILURES:-}
      LLM_PROVIDER_VLLM_BREAKER_OPEN_MS: ${LLM_PROVIDER_VLLM_BREAKER_OPEN_MS:-}
      LLM_PROVIDER_APERTUS_BASE_URL: ${LLM_PROVIDER_APERTUS_BASE_URL:-}
      LLM_PROVIDER_APERTUS_API_KEY: ${LLM_PROVIDER_APERTUS_API_KEY:-}
      LLM_PROVIDER_APERTUS_MODEL: ${LLM_PROVIDER_APERTUS_MODEL:-}
      LLM_PROVIDER_APERTUS_MODEL_ID: ${LLM_PROVIDER_APERTUS_MODEL_ID:-}
      LLM_PROVIDER_APERTUS_CONCURRENCY: ${LLM_PROVIDER_APERTUS_CONCURRENCY:-2}
      LLM_PROVIDER_APERTUS_TIMEOUT_MS: ${LLM_PROVIDER_APERTUS_TIMEOUT_MS:-60000}
      LLM_PROVIDER_APERTUS_JSON_MODE: ${LLM_PROVIDER_APERTUS_JSON_MODE:-}
      LLM_PROVIDER_APERTUS_EXTRA_BODY: ${LLM_PROVIDER_APERTUS_EXTRA_BODY:-}
      LLM_PROVIDER_APERTUS_DISABLE_REASONING: ${LLM_PROVIDER_APERTUS_DISABLE_REASONING:-1}
      LLM_PROVIDER_APERTUS_MAX_QUEUED: ${LLM_PROVIDER_APERTUS_MAX_QUEUED:-}
      LLM_PROVIDER_APERTUS_RETRIES: ${LLM_PROVIDER_APERTUS_RETRIES:-}
      LLM_PROVIDER_APERTUS_PRICE_IN: ${LLM_PROVIDER_APERTUS_PRICE_IN:-}
      LLM_PROVIDER_APERTUS_PRICE_OUT: ${LLM_PROVIDER_APERTUS_PRICE_OUT:-}
      LLM_PROVIDER_APERTUS_BREAKER_FAILURES: ${LLM_PROVIDER_APERTUS_BREAKER_FAILURES:-}
      LLM_PROVIDER_APERTUS_BREAKER_OPEN_MS: ${LLM_PROVIDER_APERTUS_BREAKER_OPEN_MS:-}
      # Quotas par joueur (décision 0009 : 100 EUR/mois, modèles et mémoire compris, ~200 joueurs actifs — calcul dans
      # docs/ai/ARCHITECTURE.md § Budget), échéances des requêtes vivantes, lissage de la Gazette, confirmation de doctrine.
      LLM_QUOTA_TALK_HOUR: ${LLM_QUOTA_TALK_HOUR:-6}
      LLM_QUOTA_TALK_DAY: ${LLM_QUOTA_TALK_DAY:-10}
      LLM_QUOTA_DOCTRINE_DAY: ${LLM_QUOTA_DOCTRINE_DAY:-6}
      LLM_QUOTA_BRIEFING_DAY: ${LLM_QUOTA_BRIEFING_DAY:-4}
      LLM_QUOTA_COUNSEL_DAY: ${LLM_QUOTA_COUNSEL_DAY:-8}
      LLM_BUDGET_EUR_MONTH: ${LLM_BUDGET_EUR_MONTH:-100}
      LLM_BUDGET_ALERT_RATIO: ${LLM_BUDGET_ALERT_RATIO:-0.8}
      # Mémoire longue dédiée à Aurane (instance séparée de la mémoire ninabot ; PUT/GET/DELETE /memory/{colony}, Bearer).
      # Absente = Postgres seul. Valeurs dans .env (Vaultwarden collection aurane, items env=AURANE_MEMORY_*).
      AURANE_MEMORY_URL: ${AURANE_MEMORY_URL:-}
      AURANE_MEMORY_TOKEN: ${AURANE_MEMORY_TOKEN:-}
      # Fiabilité (docs/ai/ARCHITECTURE.md § Fiabilité de la mémoire) : seuils de /api/admin/memory/health.
      AURANE_MEMORY_ALERT_OUTBOX_S: ${AURANE_MEMORY_ALERT_OUTBOX_S:-900}
      AURANE_MEMORY_ALERT_BACKUP_H: ${AURANE_MEMORY_ALERT_BACKUP_H:-26}
      LLM_TALK_DEADLINE_MS: ${LLM_TALK_DEADLINE_MS:-25000}
      LLM_BRIEFING_DEADLINE_MS: ${LLM_BRIEFING_DEADLINE_MS:-8000}
      LLM_GAZETTE_SPREAD_MIN: ${LLM_GAZETTE_SPREAD_MIN:-40}
      LLM_COUNSEL_LEAD_MIN: ${LLM_COUNSEL_LEAD_MIN:-20}
      LLM_COUNSEL_DEADLINE_MS: ${LLM_COUNSEL_DEADLINE_MS:-3000}
      LLM_EPISODE_SPREAD_MIN: ${LLM_EPISODE_SPREAD_MIN:-30}
      LLM_WORKERS: ${LLM_WORKERS:-4}
      DOCTRINE_CONFIRM: ${DOCTRINE_CONFIRM:-0}
      # Compatibilité (à retirer quand .env est migré) :
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_BASE_URL:-}
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY:-}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-}
      LLM_PRIMARY_CONCURRENCY: ${LLM_PRIMARY_CONCURRENCY:-2}
      LLM_PRIMARY_TIMEOUT_MS: ${LLM_PRIMARY_TIMEOUT_MS:-}
      LLM_PRIMARY_JSON_MODE: ${LLM_PRIMARY_JSON_MODE:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_CONCURRENCY: ${LLM_FALLBACK_CONCURRENCY:-4}
      LLM_PRIMARY_DISABLE_REASONING: ${LLM_PRIMARY_DISABLE_REASONING:-}
      LLM_PRIMARY_EXTRA_BODY: ${LLM_PRIMARY_EXTRA_BODY:-}
      LLM_PRIMARY_PRICE_IN: ${LLM_PRIMARY_PRICE_IN:-}
      LLM_PRIMARY_PRICE_OUT: ${LLM_PRIMARY_PRICE_OUT:-}
      LLM_FALLBACK_TIMEOUT_MS: ${LLM_FALLBACK_TIMEOUT_MS:-}
      LLM_FALLBACK_JSON_MODE: ${LLM_FALLBACK_JSON_MODE:-}
      LLM_FALLBACK_DISABLE_REASONING: ${LLM_FALLBACK_DISABLE_REASONING:-}
      LLM_FALLBACK_EXTRA_BODY: ${LLM_FALLBACK_EXTRA_BODY:-}
      LLM_FALLBACK_PRICE_IN: ${LLM_FALLBACK_PRICE_IN:-}
      LLM_FALLBACK_PRICE_OUT: ${LLM_FALLBACK_PRICE_OUT:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurane
      POSTGRES_DB: aurane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurane -d aurane"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Client web (apps/web, build Vite copié dans ./web/dist au déploiement) + proxy /api, /ws, /gazette → world.
  # Le world server ne sert pas de statique : sans ce service, https://play.playaurane.com/ répond 401.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [world]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # La mémoire longue des Généraux (décision 0009) : instance dédiée, jamais exposée (réseau Compose seul), jeton
  # AURANE_MEMORY_TOKEN partagé avec world, données dans le volume memdata (SQLite WAL, synchronous=FULL), sauvegardée
  # chaque nuit par backup/pg-backup.sh (VACUUM INTO vérifié → SOS memory/), testée par backup/memory-restore-test.sh.
  memory:
    build: ./memory
    image: aurane-memory:local
    restart: unless-stopped
    environment:
      MEMORY_TOKEN: ${AURANE_MEMORY_TOKEN:-}
    volumes:
      - memdata:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [web]

volumes:
  pgdata:
  memdata:

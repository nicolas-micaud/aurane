# Production stack for one season on a single Exoscale VM (ninabot pattern: compose +
# tunnel). Ports bind to loopback only; cloudflared publishes the world over the tunnel and
# the tailnet carries everything else. Secrets come from .env, loaded from Vaultwarden at
# deploy time, never committed.
services:
  world:
    image: ${WORLD_IMAGE:-aurane-world:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://aurane:${POSTGRES_PASSWORD}@postgres:5432/aurane
      SEASON_SEED: ${SEASON_SEED:-season-0}
      GALAXY_RADIUS: ${GALAXY_RADIUS:-12}
      # Closed beta: invitations, admin endpoint and device links (decision: bêta fermée, 24.09.2026).
      REQUIRE_INVITE: ${REQUIRE_INVITE:-1}
      INVITE_CODES: ${INVITE_CODES:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      AUTH_SECRET: ${AUTH_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://play.playaurane.com}
      SEASON_DAYS: ${SEASON_DAYS:-56}
      NPC_COUNT: ${NPC_COUNT:-30}
      TIME_SCALE: "1"
      HOST: 0.0.0.0
      PORT: "8080"
      # LLM (packages/general/src/llm.ts) : primaire rog1 via le tailnet, repli Infomaniak. Valeurs dans .env
      # (Vaultwarden collection aurane, items env=LLM_*). Absentes = pas de Général LLM, le monde tourne quand même.
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_BASE_URL:-}
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY:-}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-}
      LLM_PRIMARY_CONCURRENCY: ${LLM_PRIMARY_CONCURRENCY:-2}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_CONCURRENCY: ${LLM_FALLBACK_CONCURRENCY:-4}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurane
      POSTGRES_DB: aurane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurane -d aurane"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Client web (apps/web, build Vite copié dans ./web/dist au déploiement) + proxy /api, /ws, /gazette → world.
  # Le world server ne sert pas de statique : sans ce service, https://play.playaurane.com/ répond 401.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [world]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [web]

volumes:
  pgdata:

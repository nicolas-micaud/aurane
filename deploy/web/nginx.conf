# Frontal du jeu : sert le client web (apps/web, build Vite) et proxie l'API, le WebSocket et les pages
# publiques vers le world server. Le tunnel Cloudflare pointe sur ce service (web:80).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    types { application/manifest+json webmanifest; }
    include /etc/nginx/mime.types;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { proxy_pass http://world:8080/healthz; }
    location /api/     { proxy_pass http://world:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }
    location /gazette  { proxy_pass http://world:8080; proxy_set_header Host $host; }
    location /c/       { proxy_pass http://world:8080; proxy_set_header Host $host; }
    location = /ws {
        proxy_pass http://world:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
